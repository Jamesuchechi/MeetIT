# fly.toml app configuration file generated for meetit on 2026-11-06T11:44:11Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'meetit'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  PORT = '8787'
  STUN_URLS = 'stun:stun.l.google.com:19302'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '5s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
