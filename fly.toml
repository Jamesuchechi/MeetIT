app = 'meetit-signaling'
primary_region = 'iad'

[build]
  dockerfile = 'Dockerfile'

[env]
  PORT = '8787'
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  STUN_URLS = 'stun:stun.l.google.com:19302'

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 1000
    soft_limit = 800

  [[http_service.checks]]
    grace_period = '5s'
    interval = '15s'
    method = 'GET'
    path = '/healthz'
    timeout = '3s'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

