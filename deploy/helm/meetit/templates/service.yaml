apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-signaling
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-signaling
  ports:
    - port: {{ .Values.signaling.port }}
      targetPort: {{ .Values.signaling.port }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-web
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-web
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
