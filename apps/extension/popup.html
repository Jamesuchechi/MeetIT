<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>MeetIT</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        width: 260px;
        padding: 14px;
        background: #0f172a;
        color: #f8fafc;
        margin: 0;
      }
      button {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: none;
        background: #3b82f6;
        color: #fff;
        font-weight: 600;
        cursor: pointer;
        margin-top: 8px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #fff;
        margin-top: 8px;
      }
    </style>
  </head>
  <body>
    <strong>MeetIT Quick Start</strong>
    <button id="start-btn">Start Instant Meeting</button>
    <input id="code-input" placeholder="Or enter code (xxx-xxxx-xxx)" />
    <button id="join-btn" style="background: #1e293b">Join Meeting</button>
    <script src="popup.js"></script>
  </body>
</html>
